# Local development stack.
#
# - `db`       : Postgres for local development ONLY. In production you'll point
#                DATABASE_URL at Supabase instead and this service is not used.
# - `web`      : the Django app, hot-reloading via a bind mount.
# - `tailwind` : watches templates + input.css and rebuilds static/css/output.css
#                into the shared bind mount so style changes appear live.
#
# Usage:
#   docker compose up --build      # start everything
#   docker compose down            # stop
#   docker compose down -v         # stop AND wipe the dev database volume

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vintazk360
    ports:
      # Expose to the host so you can connect with a DB GUI if you like.
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vintazk360"]
      interval: 5s
      timeout: 5s
      retries: 10

  tailwind:
    image: node:22-slim
    working_dir: /app
    # Install deps, vendor Flowbite's JS locally, build CSS once, then watch.
    # tty keeps the --watch process alive in a detached container.
    command: sh -c "npm install && mkdir -p static/js static/fonts && cp -f node_modules/flowbite/dist/flowbite.min.js static/js/flowbite.min.js && cp -f node_modules/@fontsource/space-grotesk/files/space-grotesk-latin-{400,500,700}-normal.woff2 static/fonts/ && npm run build:css && npm run watch:css"
    tty: true
    volumes:
      # Share the project so compiled CSS lands where Django reads it.
      - .:/app
      # Keep the container's node_modules from being shadowed by the host.
      - node_modules:/app/node_modules

  web:
    build: .
    command: /app/entrypoint.sh
    environment:
      # Local dev stack uses the development settings module.
      DJANGO_SETTINGS_MODULE: config.settings.dev
      # Inside the compose network the DB host is the service name `db`.
      # This overrides whatever is in .env so Docker always uses local Postgres.
      DATABASE_URL: postgresql://postgres:postgres@db:5432/vintazk360
    ports:
      - "8000:8000"
    volumes:
      # Bind mount for live code reload during development.
      - .:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  pg_data:
  node_modules:

# Local development stack.
#
# - `db`       : Postgres for local development ONLY. On Render you point
#                DATABASE_URL at Render Postgres and this service is not used.
# - `cache`    : Valkey (the open-source Redis fork) for local development
#                ONLY, standing in for Render Key Value. Same wire protocol, so
#                the app cannot tell the difference. Nothing in it is durable by
#                design — every entry is rebuildable from Postgres.
# - `web`      : the Django app, hot-reloading via a bind mount.
# - `tailwind` : watches templates + input.css and rebuilds static/css/output.css
#                into the shared bind mount so style changes appear live.
#
# Usage:
#   docker compose up --build      # start everything
#   docker compose down            # stop
#   docker compose down -v         # stop AND wipe the dev database volume

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vintazk360
    ports:
      # Expose to the host so you can connect with a DB GUI if you like.
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vintazk360"]
      interval: 5s
      timeout: 5s
      retries: 10

  cache:
    image: valkey/valkey:8-alpine
    # Bounded and evictable, matching how Render Key Value is configured.
    # `allkeys-lru` is the right policy here rather than a `volatile-*` one:
    # every key in this instance is a derived answer, so the oldest unused one
    # is always the safest thing to drop. Version tokens are droppable too — a
    # lost token retires more than it should, which costs a recomputation and
    # never a wrong figure (see apps/core/cache.py).
    command: >
      valkey-server
      --maxmemory 64mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    ports:
      # Exposed so `manage.py` run on the HOST can reach the same cache.
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  tailwind:
    image: node:22-slim
    working_dir: /app
    # Install deps, vendor fonts / Font Awesome / Chart.js locally, build CSS once, then watch.
    # tty keeps the --watch process alive in a detached container.
    command: sh -c "npm install && mkdir -p static/fonts static/fontawesome/css static/fontawesome/fonts static/vendor && for w in 300 400 500 700; do cp -f node_modules/@fontsource/space-grotesk/files/space-grotesk-latin-$$w-normal.woff2 static/fonts/; done && for w in 100 200 300 400 500 600 700; do cp -f node_modules/@fontsource/montserrat/files/montserrat-latin-$$w-normal.woff2 static/fonts/; done && cp -f node_modules/font-awesome/css/font-awesome.min.css static/fontawesome/css/ && cp -f node_modules/font-awesome/fonts/* static/fontawesome/fonts/ && cp -f node_modules/chart.js/dist/chart.umd.js static/vendor/chart.umd.min.js && cp -f node_modules/chart.js/dist/chart.umd.js.map static/vendor/ && npm run build:css && npm run watch:css"
    tty: true
    volumes:
      # Share the project so compiled CSS lands where Django reads it.
      - .:/app
      # Keep the container's node_modules from being shadowed by the host.
      - node_modules:/app/node_modules

  web:
    build: .
    command: /app/entrypoint.sh
    environment:
      # Local dev stack uses the development settings module.
      DJANGO_SETTINGS_MODULE: config.settings.dev
      # Inside the compose network the DB host is the service name `db`.
      # This overrides whatever is in .env so Docker always uses local Postgres.
      DATABASE_URL: postgresql://postgres:postgres@db:5432/vintazk360
      # Inside the compose network the cache host is the service name `cache`.
      # Same override reasoning as DATABASE_URL: Docker always uses the local
      # Valkey container, whatever .env says.
      REDIS_URL: redis://cache:6379/0
    ports:
      - "8000:8000"
    volumes:
      # Bind mount for live code reload during development.
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy

volumes:
  pg_data:
  node_modules:

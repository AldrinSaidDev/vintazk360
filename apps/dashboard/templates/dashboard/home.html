{% extends 'base.html' %}

{% block title %}{{ title }} · Vintazk 360{% endblock %}

{% block content %}
<div class="mb-6">
    <h1 class="text-2xl font-bold tracking-tight text-slate-900">{{ title }}</h1>
    <p class="mt-1 text-sm text-slate-500">Welcome back, {{ user.get_username }}.</p>
</div>

<div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3">
    <div class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm">
        <p class="text-sm font-medium text-slate-500">Overview</p>
        <p class="mt-2 text-3xl font-bold text-slate-900">—</p>
        <p class="mt-1 text-xs text-slate-400">Placeholder card</p>
    </div>
    <div class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm">
        <p class="text-sm font-medium text-slate-500">Activity</p>
        <p class="mt-2 text-3xl font-bold text-slate-900">—</p>
        <p class="mt-1 text-xs text-slate-400">Placeholder card</p>
    </div>
    <div class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm">
        <p class="text-sm font-medium text-slate-500">Reports</p>
        <p class="mt-2 text-3xl font-bold text-slate-900">—</p>
        <p class="mt-1 text-xs text-slate-400">Placeholder card</p>
    </div>
</div>
{% endblock %}

{% load static %}
<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Vintazk 360{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
</head>
<body class="h-full bg-slate-50 text-slate-800 antialiased">
    {% block navbar %}
    <nav class="bg-white border-b border-slate-200">
        <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
            <div class="flex h-16 items-center justify-between">
                <a href="{% url 'dashboard:home' %}" class="flex items-center gap-2">
                    <span class="text-xl font-bold tracking-tight text-brand">Vintazk 360</span>
                </a>
                {% if user.is_authenticated %}
                <div class="flex items-center gap-4">
                    <span class="hidden text-sm text-slate-500 sm:inline">{{ user.get_username }}</span>
                    <form method="post" action="{% url 'logout' %}">
                        {% csrf_token %}
                        <button type="submit"
                                class="rounded-md bg-slate-100 px-3 py-1.5 text-sm font-medium text-slate-700 hover:bg-slate-200 transition">
                            Log out
                        </button>
                    </form>
                </div>
                {% endif %}
            </div>
        </div>
    </nav>
    {% endblock %}

    <main class="mx-auto max-w-7xl px-4 py-8 sm:px-6 lg:px-8">
        {% block content %}{% endblock %}
    </main>
</body>
</html>

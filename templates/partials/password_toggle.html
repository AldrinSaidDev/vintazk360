<div class="relative">
    {{ field }}
    <button type="button"
            data-password-toggle
            data-password-target="{{ field.id_for_label }}"
            aria-label="Show password"
            aria-pressed="false"
            class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-slate-400 transition hover:text-brand">
        <span class="relative inline-flex h-5 w-5 items-center justify-center">
            <span data-password-toggle-eye class="transition-opacity duration-150">
                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12s3.75-7.5 9.75-7.5S21.75 12 21.75 12s-3.75 7.5-9.75 7.5S2.25 12 2.25 12z"/>
                    <circle cx="12" cy="12" r="3"/>
                </svg>
            </span>
            <span data-password-toggle-slash class="absolute h-0.5 w-5 rotate-45 rounded bg-current opacity-0 transition-opacity duration-150"></span>
        </span>
        <span class="sr-only" data-password-toggle-label>Show password</span>
    </button>
</div>
